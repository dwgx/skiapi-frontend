(landing) {
	# 只接首页这两条路径。/ 原本由 SPA 重定向到 /home，两个都要接，
	# 否则从 /home 进来的用户看到的还是旧页。
	handle / {
		rewrite * /index.html
		root * /var/www/skiapi-landing
		import landing_headers
		file_server
	}
	handle /home {
		rewrite * /index.html
		root * /var/www/skiapi-landing
		import landing_headers
		file_server
