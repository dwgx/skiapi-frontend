(html_inject) {
	# --- browser console banner ---------------------------------------------
	# The banner is injected here, in the proxy, because sub2api is a
	# third-party upstream image that must not be modified.
	#
	# It has to be an external file rather than an inline <script>: the app
	# sends a strict CSP (script-src 'self' 'nonce-<per-response>') and Caddy
	# cannot know the nonce it just proxied, so an inline tag would be blocked
	# by the browser. A same-origin file is covered by 'self'.
	handle /console-banner.js {
		root * /var/www/skiapi-console
		# `no-cache` means revalidate, not "don't store": the browser still keeps
		# the file and normally gets a 304 off file_server's ETag. An immutable
		# max-age would be wrong here because the filename is unversioned, so a
		# cached copy would outlive any edit to the banner by the whole TTL.
		header Cache-Control "no-cache"
		file_server
	}

	# Everything that could plausibly be an HTML document: SPA routes, but
	# never the gateway (/v1/*), the panel API (/api/*), or static assets.
	#
	# /chat* 必须排除（2026-08-09 实测踩到）：**replace 的执行不受 handle 终结性
	# 保护**。聊天页由上面 chat_app 的 handle 服务并返回 200 text/html，
	# 于是 @html_page 照样命中，注入照样发生 —— 实测 /chat 的输出末尾被塞进了
	# `<link href="/auth-theme.css">` 和 `<script src="/console-banner.js">`。
	# 后果：auth-theme.css 是给上游 Vue 登录页换肤的（选择器锚 .card-glass 等
	# 上游类名），注进我们自己的 MUI 页面纯属污染；banner 也没有意义。
	# 教训与 landing 那条同源：不要假设 handle 命中就能躲开 replace，要在
	# matcher 里显式排除。
	@html_page {
		method GET HEAD
		not path /v1/* /api/* /health /setup/* /assets/* /admin/assets/*
		not path /chat /chat/*
		not path *.js *.css *.svg *.ico *.png *.jpg *.webp *.woff2 *.map *.json
	}

	# replace-response (compiled in via xcaddy) buffers the body to correct
	# Content-Length, which would be fatal for SSE — so it is kept away from
	# streams two independent ways: the matcher above excludes /v1/*, the only
	# path that ever returns text/event-stream, and the response matcher means
	# a body is only ever buffered for a 200 text/html response.
	replace @html_page {
		match {
			status 200
			header Content-Type text/html*
		}
		# 两样东西一起注入，**必须合成一条替换**：分成两条 `"</head>" ...` 的话，
		# 第一条替换完输出里仍有 `</head>`，第二条会再命中一次，结果是嵌套注入。
		#
		# auth-theme.css：把登录/注册/找回密码三页从上游的青绿 slate 配色改成
		# 本站的紫罗兰 + #0F0F0F，与落地页和模型广场一致。
		# 只能走注入不能改源码 —— 面板是上游 sub2api 的编译产物（镜像 tag latest）。
		# 样式自身按路由自限（选择器要求页面里存在 .card-glass），所以登录之后的
		# 后台不受影响。靠加载顺序 + !important 压过 Tailwind 编译出的字面值。
		"</head>" `<link rel="stylesheet" href="/auth-theme.css?v=2"><script src="/console-banner.js" defer></script></head>`
	}

	# Without this, a client that cached the panel HTML before the injection
	# existed would revalidate, get a 304 from the app (whose ETag knows
	# nothing about our rewrite) and keep serving the banner-less body
	# indefinitely. Dropping the validator on document requests forces a fresh
	# 200; the document is 2.7KB and already Cache-Control: no-cache, so this
	# costs one small body per navigation and no extra round trip.
	request_header @html_page -If-None-Match
}

