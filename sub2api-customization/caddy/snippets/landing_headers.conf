(landing_headers) {
	# handle 是终结性的，落地页因此完全绕过应用发的那套安全头。
	# 必须在这里自己补：没有 X-Frame-Options 时，任意站点都能 iframe 套壳做钓鱼
	# （应用自己的页面有 frame-ancestors 'none' + XFO DENY，落地页原本一个都没有）。
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Frame-Options "DENY"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		# 落地页是自己写的单文件，内联 <style>/<script> 都在同源文档里，
		# 所以 'unsafe-inline' 必须放开——它没有任何用户输入面，无注入源。
		#
		# connect-src 必须显式列出**全部**探测目标，不能是 'none'。
		# 页面自己会 fetch 各入口的 /health 量延迟并标「最快」；
		# 'none' 会让浏览器拦掉请求，页面显示「无法连接」——
		# 那不是网络故障，是 CSP 与页面功能没对齐（2026-07-29 实测到的现象，
		# 控制台报 `violates the following CSP directive: connect-src 'none'`）。
		# 通配（*）仍然不用：那等于取消这条限制。
		#
		# 2026-08-06：这条注释原来就写着「新增入口时这里要一起加」，
		# 然后落地页改版把探测从 2 个扩到 4 个（api/cn/as/gw），这里没跟上，
		# 结果 cn 与 gw 被拦、四个读数全空。**改落地页的探测目标就必须回来改这行。**
		#
		# 2026-08-06 晚：补上 'self'。原注释写「放宽到 'self' 对探测无用（跨主机）」，
		# 那在当时成立 —— 那会儿页面只跨主机探四个入口。现在不成立了：
		# 新的算力墙 fetch **同源** /health，计价器 fetch **同源** /api/v1/model-plaza。
		# 而 connect-src 一旦出现就完全覆盖 default-src 'self'，
		# 于是页面连自己的源都连不上：算力墙 40 格全灭、计价器退到「离线估算」。
		# 两者在本机代理上都正常（代理不发 CSP 头），只在生产发作。
		# 'self' 只放开「页面访问自己所在的源」，不放开任何第三方，收得住。
		Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.skiapi.dev https://cn.skiapi.dev https://as.skiapi.dev https://gw.skiapi.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
		-Server
	}
	# 文件名无版本号，immutable 的 max-age 会让改动被缓存住整个 TTL。
	# no-cache 是"每次回验"，仍然走 file_server 的 ETag 拿 304。
	header Cache-Control "no-cache"
}

