(chat_app) {
	# 静态资源：/chat/assets/*、以及聊天页根部的静态文件
	# （favicon.svg / favicon.png / apple-touch-icon.png / site.webmanifest）。
	# 注意根部的这些文件必须显式列出：/chat/* 这个 matcher 会命中它们，
	# 但文档 handle 会把一切 rewrite 成 chat.html —— 图标请求会拿到
	# text/html 而不是图片（2026-08-09 实测 /chat/favicon.svg 返回 text/html）。
	@chat_assets {
		path /chat/assets/*
		path /chat/favicon.svg /chat/favicon.png /chat/favicon-32.png /chat/favicon-48.png
		path /chat/apple-touch-icon.png /chat/site.webmanifest /chat/icons.svg
		path /chat/skiapi-favicon.png /chat/skiapi-favicon.ico
	}
	handle @chat_assets {
		root * /var/www/skiapi-chat
		uri strip_prefix /chat
		# 文件名带内容哈希（chat-DwhEGsq0.js），改一个字节文件名就变，
		# 所以可以放心 immutable —— 旧文件名永远指向旧内容。
		header Cache-Control "public, max-age=31536000, immutable"
		header -Server
		file_server
	}

	# SPA 文档。/chat 与 /chat/ 都要接，否则少一条会落到 sub2api 的兜底路由，
	# 返回面板 HTML（现象是"打开聊天页看到面板"，而不是 404，很难查）。
	@chat_doc path /chat /chat/*
	handle @chat_doc {
		rewrite * /chat.html
		root * /var/www/skiapi-chat
		header {
			Strict-Transport-Security "max-age=31536000; includeSubDomains"
			X-Frame-Options "DENY"
			X-Content-Type-Options "nosniff"
			Referrer-Policy "strict-origin-when-cross-origin"

			# 专属 CSP。与落地页那份的差别都是必需的：
			#
			# script-src 不含 'unsafe-inline'：产物是外部 JS（/chat/assets/*.js），
			#   'self' 就够。比落地页更严 —— 落地页是单文件内联 <script> 才需要放开。
			# style-src 必须含 'unsafe-inline'：MUI/Emotion 在运行时往 <head> 注入
			#   <style>，没有 nonce 可用。这是 CSS-in-JS 的固有代价，不是疏漏。
			# connect-src 'self'：聊天页 fetch 的全是同源相对路径
			#   —— /api/v1/auth/me、/api/v1/keys、/api/v1/usage/dashboard/stats、
			#   /v1/chat/completions（SSE）、/v1/models。不需要放开任何第三方。
			# img-src 含 data: 与 blob:：用户粘贴/选择的图片先转 dataURL 预览，
			#   模型也可能回 blob。少了这两个，图片消息全裂。
			# font-src 'self' data:：Geist 系字体自托管在 /chat/assets/。
			Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"
			-Server
		}
		# 文档名不带哈希，必须每次回验，否则改版后老用户拿不到新 bundle 引用。
		header Cache-Control "no-cache"
		file_server
	}
}

# 站点图标。四条路径全部由 Caddy 就地服务，不进应用。
#
# 为什么要接 /logo.svg：那是 sub2api 自带的上游厂商标志（面板 index.html 里
# `<link rel="icon" type="image/svg+xml" href="/logo.svg">`），镜像是第三方的、
# 不能改。全文检索过面板的 JS/CSS bundle，logo.svg 只出现在这个 icon 链接里，
# 没有任何组件引用它，所以覆盖这条路径只换浏览器标签页图标，不动面板内的任何
# 视觉元素。文件是把 PNG 包进 SVG 外壳，保持和 `type="image/svg+xml"` 一致——
# 直接回 PNG 虽然多数浏览器也认，但声明与实体不符没有必要。
#
# /favicon.ico 和 /favicon.png 是浏览器在页面没声明图标时的默认探测路径。
# 接之前它们落到 SPA，返回的是 200 + text/html（面板首页的 HTML），
# 浏览器拿到一份不是图片的 200 响应；落地页当时也完全没有声明图标。
#
# 这四条路径已经在 @html_page 的 `not path *.ico *.png *.svg` 里被排除，
# 不会被 replace 缓冲，与 banner 注入互不影响。
#
# /anthropic.svg（2026-08-06 新增）是站点图标的矢量主源，落地页把它声明成
# 第一个 `rel="icon"`，PNG/ICO 只作回退。用**新文件名**而不是覆盖 logo.svg
# 是刻意的：CDN 边缘的缓存键忽略查询串，`?v=` 刷不掉边缘，只有没被缓存过的
# 路径才能立刻生效。（对比：/logo.svg 至今仍是边缘 HIT 的旧货，磁盘 13281
# 字节而边缘回 2010 字节。）
# 这个片段给的 `Cache-Control: no-cache` 已实测被边缘尊重（X-Cache-Status:
# MISS from L1），所以就地替换 favicon.ico / favicon.png / apple-touch-icon.png
# 的字节是会立刻传播的，不需要再换名。
# ============================================================================
# 往面板 HTML 里注入的东西（console banner + 登录页配色）
#
# 抽成片段的理由，是一个已经犯过两次的错误：
# **CDN 用 HTTP 回源**，所以公网请求最终落在 `http://skiapi.dev, ...` 那个块，
# 而不是直连的 `skiapi.dev, ...` 块。只在 https 块里配注入，源站自测（curl 到
# 127.0.0.1）一切正常，公网却完全看不到 —— 2026-08-06 先在 k1ro 的 favicon
# 上踩了一次，一小时后又在这个注入上踩了同一次。
#
# 现在两个块都 `import html_inject`，改注入只需改这一处。
# 新增站点块时：只要它经 CDN 或直连服务面板 HTML，就要 import 它。
