(favicon) {
	# /auth-theme.css 必须列在这里，否则它会落到 SPA 的兜底路由：
	# 实测返回 `Content-Type: text/html` + index.html 的内容，
	# 再加上 nosniff，浏览器直接拒绝把它当样式表用 ——
	# 现象是 document.styleSheets 里**看得到**这张表（所以"加载成功"的判断会骗人），
	# 但 cssRules 抛 SecurityError、一条规则都不生效。
	# 判断样式有没有生效要看 computed style，不能看 link 在不在。
	@favicon path /favicon.ico /favicon.png /apple-touch-icon.png /logo.svg /anthropic.svg /auth-theme.css

	# 模型广场：用我们自己的静态页覆盖上游 SPA 的同名路由。
	# handle 终结性，命中后不再走 reverse_proxy，所以这就是替换。
	# 数据仍由页面自己 fetch /api/v1/model-plaza（公开匿名），价格实时，不用维护。
	@plaza path /model-plaza /model-plaza/
	handle @plaza {
		root * /var/www/skiapi-static
		rewrite * /model-plaza.html
		# 无版本号文件名：no-cache 是"每次回验"，仍走 ETag 拿 304
		header Cache-Control "no-cache"
		header X-Content-Type-Options "nosniff"
		file_server
	}
	handle @favicon {
		root * /var/www/skiapi-static
		# handle 是终结性的，这些响应绕过了应用发的安全头，nosniff 自己补上。
		header X-Content-Type-Options "nosniff"
		# 文件名无版本号，immutable 的 max-age 会把改动缓存住整个 TTL。
		# no-cache 是"每次回验"，仍然走 file_server 的 ETag 拿 304。
		header Cache-Control "no-cache"
		file_server
	}
}

# KiroStudio panel fallback through the CDN-backed apex. Direct subdomains point
# at the origin and are unreachable from some networks. The prefix keeps the SPA
# and its admin API isolated from sub2api without changing KiroStudio itself.
